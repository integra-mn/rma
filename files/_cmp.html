<!doctype html><meta charset="utf-8">
<link href="/assets/css/fonts.css" rel="stylesheet">
<style>
 body{font-family:'Montserrat',sans-serif;background:#F4F4F4;margin:0;padding:0;}
 .col{display:inline-block;vertical-align:top;width:46%;margin:0 1.5%;}
 .h{font:600 13px Montserrat;padding:10px 0 6px;color:#2c2c2a;}
 .note{font:400 11px Montserrat;color:#a33;margin:4px 0 0;}
 /* tracking page, real values */
 .tp{background:#F4F4F4;padding:24px;border:1px dashed #bbb;}
 .tp .logo-bar{margin-bottom:18px;}
 .tp .logo-bar img{height:36px;width:auto;display:block;}
 .tp .card{background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:20px 22px;}
 /* email, current values */
 .em{background:#F4F4F4;padding:24px;border:1px dashed #bbb;}
 .em .card{background:#fff;border:0.5px solid #d3d1c7;border-radius:12px;padding:24px 26px 28px;text-align:center;}
 .em .logo-bar{margin-bottom:18px;}
 .em .logo-bar img{height:36px;width:auto;display:inline-block;}
 .lbl{font:400 11px Montserrat;color:#888;}
 .num{font:600 26px Montserrat;color:#1D9E75;}
</style>
<div class="col">
  <div class="h">Tracking page — logo sits ABOVE the card</div>
  <div class="tp">
    <div class="logo-bar"><img src="/assets/integra-email.png"></div>
    <div class="card"><div class="lbl">Reklamacija</div><div class="num">52150</div></div>
  </div>
  <p class="note">24px page padding above · 18px below · then the card</p>
</div>
<div class="col">
  <div class="h">Email — logo sits INSIDE the card</div>
  <div class="em">
    <div class="card">
      <div class="logo-bar"><img src="/assets/integra-email.png"></div>
      <div class="lbl">Reklamacija</div><div class="num">52150</div>
    </div>
  </div>
  <p class="note">24px card padding above · 18px below</p>
</div>
